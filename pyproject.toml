[project]
name = "agron"
version = "0.1.0"
description = "FastAPI service that turns an agronomic model (growing degree days) into an API, with hexagonal architecture"
readme = "README.md"
authors = [
    { name = "LucasBrum", email = "lucasbrumofficial@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "polars>=2.1.0",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agron = "agron:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
